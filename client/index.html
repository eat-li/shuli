<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="高中数学题目与作业查阅站点：按知识点、题型、难度检索题目，支持单题链接分享；同时提供老师侧的备课管理后台。"
    />
    <!-- 与 client/src/styles/theme-tokens.css 的 --paper 保持一致（#f6f7f8）。
         移动端浏览器工具栏会取这个颜色，必须跟着主题走。 -->
    <meta name="theme-color" content="#f6f7f8" />
    <meta name="color-scheme" content="light" />
    <!-- 内联 SVG favicon（避免额外的 404 请求）：近黑方章 + 白色 Σ。
         取色与 --moss #111418 一致，圆角与 --radius-sm 的 8px 语言一致。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111418'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23ffffff' font-family='Georgia,serif'%3E%E2%88%91%3C/text%3E%3C/svg%3E"
    />
    <title>数理</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
